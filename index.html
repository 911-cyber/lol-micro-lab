<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LoL Micro Lab — Movement v0.1</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="game"></div>
  <div id="hud">
    <section class="panel intro">
      <div class="eyebrow">LOL MICRO LAB • MOVEMENT PASS</div>
      <h1>Movement v0.1</h1>
      <p>Camera v1.0を固定したまま、LoLの右クリック移動を再現する段階。</p>
    </section>

    <section class="panel state">
      <div><span>MOVE SPEED</span><b>335</b></div>
      <div><span>ORDER</span><b id="moveState">IDLE</b></div>
      <div><span>CAMERA</span><b id="cameraState">UNLOCKED</b></div>
    </section>

    <section class="panel controls">
      <div><kbd>Right Click</kbd><span>Move Command</span></div>
      <div><kbd>Hold RMB</kbd><span>移動先を連続更新</span></div>
      <div><kbd>S</kbd><span>Stop Command</span></div>
      <div><kbd>画面端</kbd><span>カメラ移動</span></div>
      <div><kbd>MMB Drag</kbd><span>マップを掴んで移動</span></div>
      <div><kbd>Space</kbd><span>押している間、自分を追従</span></div>
      <div><kbd>Y</kbd><span>Camera Lock / Unlock</span></div>
      <div><kbd>Wheel</kbd><span>Zoom In / Out</span></div>
    </section>

    <div id="centerHint">RMB — MOVE • S — STOP</div>
  </div>

  <script type="importmap">
  {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
