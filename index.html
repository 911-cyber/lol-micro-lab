<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LoL Micro Lab — Camera v1.0</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="game"></div>
  <div id="hud">
    <section class="panel intro">
      <div class="eyebrow">LOL MICRO LAB • CAMERA COMPLETE</div>
      <h1>Camera v1.0</h1>
      <p>LoLのPoint & Click操作を基準にした固定カメラ仕様。</p>
    </section>

    <section class="panel state">
      <div><span>CAMERA</span><b id="cameraState">UNLOCKED</b></div>
      <div><span>ZOOM</span><b id="zoomState">MAX</b></div>
    </section>

    <section class="panel controls">
      <div><kbd>Right Click</kbd><span>移動</span></div>
      <div><kbd>画面端</kbd><span>カメラ移動</span></div>
      <div><kbd>MMB Drag</kbd><span>マップを掴んで移動</span></div>
      <div><kbd>Space</kbd><span>押している間、自分を追従</span></div>
      <div><kbd>Y</kbd><span>Camera Lock / Unlock</span></div>
      <div><kbd>Wheel</kbd><span>Zoom In / Out</span></div>
    </section>

    <div id="centerHint">SPACE — CENTER ON CHAMPION</div>
  </div>

  <script type="importmap">
  {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
